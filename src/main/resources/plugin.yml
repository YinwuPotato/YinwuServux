name: YinwuServux
version: 1.1.0
main: io.yinwu.servux.ServuxBridgePlugin
api-version: '26.3'
folia-supported: true
authors: [Yinwu]
description: 在 Canvas/Paper 服务端实现 Servux 协议：容器预览（servux:entity_data）+ 结构边界框（servux:structures）
commands:
  yinwuservux:
    description: 在 Canvas/Paper 服务端实现 Servux 协议：容器预览（servux:entity_data）+ 结构边界框（servux:structures）
    usage: /yinwuservux <status|reload>
    aliases: [yservux]
    permission: yinwu.servux.admin
permissions:
  yinwu.servux.admin:
    description: 在 Canvas/Paper 服务端实现 Servux 协议：容器预览（servux:entity_data）+ 结构边界框（servux:structures）
    default: op
  yinwu.servux.use:
    description: 在 Canvas/Paper 服务端实现 Servux 协议：容器预览（servux:entity_data）+ 结构边界框（servux:structures）
    default: true
